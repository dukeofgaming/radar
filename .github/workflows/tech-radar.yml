name: Tech Radar

on:
  push:
    branches: ['main']

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate_tech_radar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Same AOE 3.x build the live site was generated with
      # (flexion/tech-radar-generator@v0.1.2). That action pins
      # upload-pages-artifact@v2, which no longer runs, so the deploy
      # steps below are the current GitHub Pages actions. PUBLIC_URL
      # must stay /radar: Pages is a project site.
      - name: Generate Tech Radar
        env:
          PUBLIC_URL: /radar
          REACT_APP_RADAR_NAME: "David Vega's Tech Radar"
        run: |
          npm ci
          npx aoe_technology_radar-buildRadar
          npx aoe_technology_radar-generateJson
          npx aoe_technology_radar-createStaticFiles
          npm run build:static

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
